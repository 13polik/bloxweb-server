# The free Supabase database pauses after a week without traffic, which takes the whole
# game offline. Waking the server once a day makes it connect to the database and keeps it active.
name: Keep the database awake
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the server (it connects to the database on start)
        run: curl -fsS --retry 6 --retry-delay 20 --max-time 90 https://bloxweb-server.onrender.com/health
